[project]
name = "desktop-controller"
version = "0.1.0"
description = "Desktop agent controller: decision contract, game profiles, safety rules, and input scheduler."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pyyaml>=6.0",
]

[project.scripts]
desktop-profile-check = "desktop_controller.cli:profile_check"

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/desktop_controller"]

[tool.pytest.ini_options]
testpaths = ["tests"]
