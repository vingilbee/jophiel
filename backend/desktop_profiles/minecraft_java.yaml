# Minecraft Java Edition, single-player in a disposable world (plan §7.4).
# Trusted configuration: reviewed by a human, versioned, validated at load.
# Check with:  uv run desktop-profile-check desktop_profiles/*.yaml   (from backend/)
#
# Game settings this profile assumes (set them in the guest):
#   windowed 1280x720, GUI scale auto (2), FOV 70 (Minecraft's FOV is vertical),
#   mouse sensitivity 100% (default), raw input on, pause on lost focus off (F3+P).
format_version: 1
id: minecraft_java
revision: 3
display_name: "Minecraft (Java Edition)"
target: { process: javaw.exe, window_title_hint: "Minecraft" }   # process identity is authoritative
online_allowed: false

buttons:
  forward:    { key: W,           description: "move forward" }
  back:       { key: S,           description: "move backward" }
  left:       { key: A,           description: "strafe left" }
  right:      { key: D,           description: "strafe right" }
  jump:       { key: SPACE,       description: "jump; hold to swim up" }
  sprint:     { key: CTRL,        description: "sprint while moving forward" }
  sneak:      { key: SHIFT,       description: "crouch; prevents falling off edges; with menu_click moves a whole stack" }
  attack:     { key: MOUSE_LEFT,  description: "hit; hold to break the block under the crosshair" }
  use:        { key: MOUSE_RIGHT, description: "place block / use or eat held item / open doors, chests" }
  inventory:  { key: E,           description: "open or close the inventory" }
  drop:       { key: Q,           description: "drop one of the held item" }
  swap_hands: { key: F,           description: "swap item between main hand and off hand" }
  menu_click:     { key: MOUSE_LEFT,  description: "in menus: pick up or place a stack" }
  menu_alt_click: { key: MOUSE_RIGHT, description: "in menus: pick up half a stack or place one item" }
  hotbar_1:   { key: "1", description: "select hotbar slot 1" }
  hotbar_2:   { key: "2", description: "select hotbar slot 2" }
  hotbar_3:   { key: "3", description: "select hotbar slot 3" }
  hotbar_4:   { key: "4", description: "select hotbar slot 4" }
  hotbar_5:   { key: "5", description: "select hotbar slot 5" }
  hotbar_6:   { key: "6", description: "select hotbar slot 6" }
  hotbar_7:   { key: "7", description: "select hotbar slot 7" }
  hotbar_8:   { key: "8", description: "select hotbar slot 8" }
  hotbar_9:   { key: "9", description: "select hotbar slot 9" }

axes:
  # counts_per_degree from Minecraft's sensitivity formula at 100%:
  # f = 0.5*0.6+0.2, degrees per count = f^3 * 8 * 0.15 = 0.15, so ~6.67 counts
  # per degree. Calibrated 2026-10-07 in the Legion VM: the card's 360-degree
  # turn ended facing the start (mouse sensitivity 100%, raw input on).
  look_yaw:   { device: mouse_relative_x, unit: deg_per_s, counts_per_degree: 6.67, max: 360, description: "turn right (+) / left (-)" }
  look_pitch: { device: mouse_relative_y, unit: deg_per_s, counts_per_degree: 6.67, max: 180, description: "look down (+) / up (-)" }

camera: { fov_v_deg: 70 }

fact_keys: ["inventory.*", "hotbar.selected", "health", "hunger", "location", "time_of_day", "activity"]
game_notes: >
  The crosshair (screen centre) is what you hit. You only reach blocks about 4 blocks
  away: walk until the target fills a good part of the centre first. Breaking needs
  attack held, with no look axes, until it breaks; a log takes about 3 s by hand, and
  moving the view restarts it. Broken blocks drop items you pick up by walking over
  them. If attacking changes nothing for 3 s, walk closer or re-aim. The hotbar is at
  the bottom; "inventory" opens the full one. Avoid caves and water; night is dangerous.

observation:
  size: [640, 360]
  frames: 1
  crops:
    - { region: hotbar, scale: 2 }
    - { region: status_bars, scale: 2 }

# Rectangles [x0, y0, x1, y1] in 640x360 observation pixels, for a 1280x720
# window at GUI scale 2. Re-measure against a real frame in stage C.
regions:
  crosshair:   [304, 164, 336, 196]
  hotbar:      [228, 338, 412, 360]
  status_bars: [228, 318, 412, 338]

macros: {}

contexts:
  detect: { method: cursor_visibility, cursor_hidden: playing, cursor_visible: menu }
  modes:
    playing: { allow: [hold, axes, tap, look_at, turn] }
    menu:
      allow: [hold, click, drag, scroll, move, tap]
      buttons: [inventory, sneak, menu_click, menu_alt_click]

limits:
  default_valid_for_ms: 1500
  max_valid_for_ms: 3000
  max_until_ms: 8000
  max_wait_ms: 2000
  default_tap_ms: 50
  max_tap_hold_ms: 500
  max_events: 12
  max_taps_per_s: 10
  max_drag_points: 32
  max_until_conditions: 3
  max_hold_buttons: 4
