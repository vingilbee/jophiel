# Generic keyboard + mouse fallback (plan §7.4): try a new game the same day.
# This is a TEMPLATE: copy it, set target.process to the game's executable,
# give it a new id, and it passes the checker. Raw names, conservative limits,
# no camera (so no look_at), no macros. Replace it with a tuned profile once the
# game's needs are known. Esc, Tab and Alt are deliberately absent.
format_version: 1
id: generic_keyboard_mouse
revision: 1
display_name: "Generic keyboard and mouse"
target: { process: REPLACE_ME.exe }
online_allowed: false

buttons:
  key_a: { key: A, description: "A key" }
  key_b: { key: B, description: "B key" }
  key_c: { key: C, description: "C key" }
  key_d: { key: D, description: "D key" }
  key_e: { key: E, description: "E key" }
  key_f: { key: F, description: "F key" }
  key_g: { key: G, description: "G key" }
  key_h: { key: H, description: "H key" }
  key_i: { key: I, description: "I key" }
  key_j: { key: J, description: "J key" }
  key_k: { key: K, description: "K key" }
  key_l: { key: L, description: "L key" }
  key_m: { key: M, description: "M key" }
  key_n: { key: N, description: "N key" }
  key_o: { key: O, description: "O key" }
  key_p: { key: P, description: "P key" }
  key_q: { key: Q, description: "Q key" }
  key_r: { key: R, description: "R key" }
  key_s: { key: S, description: "S key" }
  key_t: { key: T, description: "T key" }
  key_u: { key: U, description: "U key" }
  key_v: { key: V, description: "V key" }
  key_w: { key: W, description: "W key" }
  key_x: { key: X, description: "X key" }
  key_y: { key: Y, description: "Y key" }
  key_z: { key: Z, description: "Z key" }
  key_0: { key: "0", description: "0 key" }
  key_1: { key: "1", description: "1 key" }
  key_2: { key: "2", description: "2 key" }
  key_3: { key: "3", description: "3 key" }
  key_4: { key: "4", description: "4 key" }
  key_5: { key: "5", description: "5 key" }
  key_6: { key: "6", description: "6 key" }
  key_7: { key: "7", description: "7 key" }
  key_8: { key: "8", description: "8 key" }
  key_9: { key: "9", description: "9 key" }
  arrow_up: { key: UP, description: "up arrow key" }
  arrow_down: { key: DOWN, description: "down arrow key" }
  arrow_left: { key: LEFT, description: "left arrow key" }
  arrow_right: { key: RIGHT, description: "right arrow key" }
  space: { key: SPACE, description: "space bar" }
  shift: { key: SHIFT, description: "shift key" }
  ctrl:  { key: CTRL, description: "control key" }
  mouse_left:   { key: MOUSE_LEFT, description: "left mouse button" }
  mouse_right:  { key: MOUSE_RIGHT, description: "right mouse button" }
  mouse_middle: { key: MOUSE_MIDDLE, description: "middle mouse button" }

axes:
  mouse_x: { device: mouse_relative_x, unit: counts_per_s, max: 3000, description: "relative mouse right (+) / left (-), counts per second" }
  mouse_y: { device: mouse_relative_y, unit: counts_per_s, max: 3000, description: "relative mouse down (+) / up (-), counts per second" }

observation:
  size: [640, 360]
  frames: 1

regions: {}
macros: {}

contexts:
  detect: { method: none }
  modes:
    any: { allow: [hold, axes, tap, click, drag, move, scroll] }

limits:
  default_valid_for_ms: 1000
  max_valid_for_ms: 2000
  max_until_ms: 5000
  max_wait_ms: 1000
  default_tap_ms: 50
  max_tap_hold_ms: 300
  max_events: 8
  max_taps_per_s: 6
  max_drag_points: 16
  max_until_conditions: 2
  max_hold_buttons: 3
