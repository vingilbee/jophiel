[project]
name = "desktop-controller"
version = "0.14.0"
description = "Desktop agent controller: decision contract, game profiles, safety rules, and input scheduler."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "websockets>=13",
    "pillow>=10",
    "numpy>=1.26",
    "mss>=9.0.1",
    "zeroconf>=0.136",
]

[project.scripts]
desktop-profile-check = "desktop_controller.cli:profile_check"
desktop-controller = "desktop_controller.cli:controller"

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/desktop_controller"]

[tool.pytest.ini_options]
testpaths = ["tests"]
